<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071018"><meta name="apple-mobile-web-app-capable" content="yes"><title>GPS-nopeusmittari</title><style>
:root{--bg:#071018;--panel:#0d1821;--text:#f4f8fb;--muted:#8fa4b5;--accent:#36e39b;--blue:#45a9ff;--danger:#ff6578}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overscroll-behavior:none;background:var(--bg)}body{min-height:100dvh;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{width:min(100%,560px);min-height:100dvh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 12%,#173149 0,#071018 48%,#03070b 100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:.86rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.status{display:flex;align-items:center;gap:7px;font-size:.77rem;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#687782}.dot.on{background:var(--accent);box-shadow:0 0 12px #36e39b}.dot.err{background:var(--danger)}.panel{display:none}.panel.active{display:block}.speed-wrap{display:grid;place-items:center;min-height:clamp(285px,48dvh,410px)}.dial{width:min(78vw,370px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(from 225deg,var(--accent) 0deg,var(--accent) var(--angle,0deg),#263744 var(--angle,0deg),#263744 270deg,transparent 270deg);filter:drop-shadow(0 15px 35px #0008)}.dial:before{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#132534,#081119 68%);border:1px solid #ffffff13}.speed{text-align:center;z-index:1}.speed-number{font-variant-numeric:tabular-nums;font-size:clamp(5rem,27vw,8rem);font-weight:780;letter-spacing:-.07em;line-height:.84}.unit{margin-top:14px;color:var(--muted);font-weight:750;letter-spacing:.15em}.accuracy{margin-top:9px;font-size:.75rem;color:var(--muted)}.card,.session,.detail-card{background:#0d1821e8;border:1px solid #ffffff12;border-radius:20px;padding:15px;box-shadow:0 15px 40px #0007}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.label{color:var(--muted);font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}.value{margin-top:5px;font-size:clamp(1rem,4.8vw,1.25rem);font-weight:760;font-variant-numeric:tabular-nums}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button{min-height:48px;border:0;border-radius:14px;padding:11px 7px;font:inherit;font-weight:760;color:#06120e;background:var(--accent);cursor:pointer}button.secondary{color:var(--text);background:#213442}button.stop{color:white;background:#7a2635}button.new{width:100%;margin-top:9px;color:#06121a;background:var(--blue)}button:disabled{opacity:.38}.bottom-info{display:flex;justify-content:space-between;align-items:end;margin-top:10px;padding:0 3px}.clock{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}.guard{font-size:.7rem;color:var(--accent);text-align:right}.log-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 12px}.log-head h2{margin:0;font-size:1.2rem}.small-btn{min-height:38px;padding:7px 12px;font-size:.78rem;background:#213442;color:white}.session-list{display:grid;gap:10px}.session{box-shadow:none;cursor:pointer}.session-top,.session-stats,.detail-head,.lap-row{display:flex;justify-content:space-between;gap:10px}.session-title{font-weight:800}.session-date,.session-stats{color:var(--muted);font-size:.76rem;margin-top:5px}.session-stats strong{color:var(--text)}.detail-head{align-items:center;margin:16px 0 10px}.detail-head h2{font-size:1.05rem;margin:0}.chart-wrap{margin-top:14px;padding:8px;background:#081119;border-radius:14px}.chart-label{font-size:.72rem;color:var(--muted);margin:2px 4px 8px}canvas{width:100%;height:220px;display:block}.chart-tip{min-height:22px;color:var(--accent);font-size:.76rem;text-align:center;margin-top:5px}.laps-title{font-weight:800;margin:16px 0 7px}.lap-row{padding:9px 2px;border-top:1px solid #ffffff10;color:var(--muted);font-size:.8rem}.lap-row strong{color:var(--text)}.empty{text-align:center;color:var(--muted);padding:70px 20px}nav{position:fixed;z-index:5;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);display:grid;grid-template-columns:1fr 1fr;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#071018ee;border-top:1px solid #ffffff12;backdrop-filter:blur(15px)}.tab{background:transparent;color:var(--muted);min-height:52px}.tab.active{background:#173044;color:var(--accent)}@media(max-height:680px){.speed-wrap{min-height:250px}.dial{width:min(57dvh,300px)}}
</style></head><body><main class="app"><header><div class="title">GPS-nopeusmittari</div><div class="status"><span id="dot" class="dot"></span><span id="gpsStatus">GPS käynnistyy…</span></div></header>
<section id="meterPanel" class="panel active"><div class="speed-wrap"><div id="dial" class="dial"><div class="speed"><div id="speed" class="speed-number">0</div><div class="unit">km/h</div><div id="accuracy" class="accuracy">Tarkkuus: –</div></div></div></div><div class="card"><div class="stats"><div><div class="label">Trippi</div><div id="distance" class="value">0,00 km</div></div><div><div class="label">Aika</div><div id="elapsed" class="value">00:00:00</div></div><div><div class="label">Keskinop.</div><div id="average" class="value">0,0</div></div></div><div class="buttons"><button id="start">Käynnistä</button><button id="lap" class="secondary" disabled>Väliaika</button><button id="stop" class="stop" disabled>Pysäytä</button></div><button id="newMeasurement" class="new">Uusi mittaus</button></div><div class="bottom-info"><div id="clock" class="clock">--:--:--</div><div class="guard">Päivityksen esto käytössä</div></div></section>
<section id="logPanel" class="panel"><div id="logMain"><div class="log-head"><h2>Mittausloki</h2><button id="clearLog" class="small-btn">Tyhjennä kaikki</button></div><div id="sessionList" class="session-list"></div></div><div id="logDetail" style="display:none"><div class="detail-head"><button id="backLog" class="small-btn">← Takaisin</button><h2 id="detailTitle">Mittaus</h2></div><div class="detail-card"><div id="detailStats" class="stats"></div><div class="chart-wrap"><div class="chart-label">Nopeus ajan funktiona — kosketa käyrää nähdäksesi arvon</div><canvas id="chart"></canvas><div id="chartTip" class="chart-tip"></div></div><div class="laps-title">Väliajat</div><div id="detailLaps"></div></div></div></section></main><nav><button class="tab active" data-panel="meterPanel">Mittari</button><button class="tab" data-panel="logPanel">Loki</button></nav>
<script>
const $=id=>document.getElementById(id);let lastPos=null,tripMeters=0,running=false,startedAt=0,accumulatedMs=0,timer=null,wakeLock=null,lastLogAt=0,current=null,chartPoints=[];let sessions=JSON.parse(localStorage.getItem('gpsSessions')||'[]');
const fmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return[h,m,s%60].map(v=>String(v).padStart(2,'0')).join(':')},elapsed=()=>accumulatedMs+(running?Date.now()-startedAt:0),fi=(n,d=1)=>n.toLocaleString('fi-FI',{minimumFractionDigits:d,maximumFractionDigits:d});function save(){localStorage.setItem('gpsSessions',JSON.stringify(sessions.slice(-100)))}function ensureSession(){if(current)return;current={id:Date.now(),started:Date.now(),ended:null,distance:0,duration:0,points:[],laps:[]};sessions.push(current);save()}
function update(){let ms=elapsed();$('elapsed').textContent=fmt(ms);$('distance').textContent=fi(tripMeters/1000,2)+' km';$('average').textContent=fi(ms?(tripMeters/1000)/(ms/3600000):0,1)}function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,d1=r(b.latitude-a.latitude),d2=r(b.longitude-a.longitude),q=Math.sin(d1/2)**2+Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function setSpeed(k){k=Math.max(0,Math.min(299,k||0));$('speed').textContent=Math.round(k);$('dial').style.setProperty('--angle',Math.min(k/180,1)*270+'deg')}
function logPoint(k,c){if(!running||Date.now()-lastLogAt<2000)return;lastLogAt=Date.now();ensureSession();current.points.push({t:Date.now(),s:+k.toFixed(1),a:Math.round(c.accuracy),d:+(tripMeters/1000).toFixed(3)});current.distance=tripMeters;current.duration=elapsed();save()}
function onPos(p){const c=p.coords;$('dot').className='dot on';$('gpsStatus').textContent='GPS aktiivinen';$('accuracy').textContent='Tarkkuus: ±'+Math.round(c.accuracy)+' m';let k=Number.isFinite(c.speed)&&c.speed>=0?c.speed*3.6:0;if(lastPos){const dt=(p.timestamp-lastPos.timestamp)/1000,dist=hav(lastPos.coords,c);if((!Number.isFinite(c.speed)||c.speed<0)&&dt>0)k=dist/dt*3.6;if(running&&c.accuracy<=50&&dt>0&&dt<15&&dist>Math.max(1.5,c.accuracy*.12))tripMeters+=dist}lastPos={coords:{latitude:c.latitude,longitude:c.longitude},timestamp:p.timestamp};if(k<1.5)k=0;setSpeed(k);logPoint(k,c);update()}function onErr(e){$('dot').className='dot err';$('gpsStatus').textContent=e.code===1?'Sijaintilupa estetty':'GPS ei saatavilla';$('accuracy').textContent=e.message}navigator.geolocation?navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:500,timeout:15000}):onErr({message:'Selain ei tue paikannusta'});
async function lock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}$('start').onclick=()=>{if(running)return;ensureSession();running=true;startedAt=Date.now();if(!current.started)current.started=startedAt;lastPos=null;$('start').disabled=true;$('lap').disabled=false;$('stop').disabled=false;timer=setInterval(update,250);lock()};$('lap').onclick=()=>{if(!running)return;ensureSession();current.laps.push({t:Date.now(),duration:elapsed(),distance:tripMeters});save()};function stop(){if(!running)return;accumulatedMs+=Date.now()-startedAt;running=false;clearInterval(timer);current.duration=accumulatedMs;current.distance=tripMeters;current.ended=Date.now();save();$('start').disabled=false;$('start').textContent='Jatka';$('lap').disabled=true;$('stop').disabled=true;update();if(wakeLock){wakeLock.release();wakeLock=null}}$('stop').onclick=stop;$('newMeasurement').onclick=()=>{stop();current=null;tripMeters=0;accumulatedMs=0;lastPos=null;lastLogAt=0;$('start').textContent='Käynnistä';setSpeed(0);update()};
function renderSessions(){$('logMain').style.display='block';$('logDetail').style.display='none';let box=$('sessionList');box.innerHTML='';if(!sessions.length){box.innerHTML='<div class="empty">Ei vielä mittauksia.</div>';return}sessions.slice().reverse().forEach((s,i)=>{let max=s.points.length?Math.max(...s.points.map(p=>p.s)):0,d=document.createElement('div');d.className='session';d.innerHTML=`<div class="session-top"><span class="session-title">Mittaus ${sessions.length-i}</span><span>›</span></div><div class="session-date">${new Date(s.started).toLocaleString('fi-FI')}</div><div class="session-stats"><span><strong>${fi((s.distance||0)/1000,2)} km</strong></span><span>${fmt(s.duration||0)}</span><span>max ${fi(max,1)} km/h</span></div>`;d.onclick=()=>showDetail(s);box.appendChild(d)})}
function showDetail(s){$('logMain').style.display='none';$('logDetail').style.display='block';$('detailTitle').textContent=new Date(s.started).toLocaleString('fi-FI');let max=s.points.length?Math.max(...s.points.map(p=>p.s)):0,avg=s.duration?(s.distance/1000)/(s.duration/3600000):0;$('detailStats').innerHTML=`<div><div class="label">Matka</div><div class="value">${fi((s.distance||0)/1000,2)} km</div></div><div><div class="label">Aika</div><div class="value">${fmt(s.duration||0)}</div></div><div><div class="label">Max / ka</div><div class="value">${fi(max,0)} / ${fi(avg,0)}</div></div>`;$('detailLaps').innerHTML=s.laps.length?s.laps.map((l,i)=>`<div class="lap-row"><span>Väliaika ${i+1}</span><strong>${fmt(l.duration)} · ${fi(l.distance/1000,2)} km</strong></div>`).join(''):'<div class="session-date">Ei väliaikoja</div>';requestAnimationFrame(()=>drawChart(s.points))}
function drawChart(points){const c=$('chart'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const w=r.width,h=r.height,pad={l:34,r:10,t:12,b:28};x.clearRect(0,0,w,h);x.font='11px system-ui';x.strokeStyle='#274050';x.fillStyle='#8fa4b5';x.lineWidth=1;let max=Math.max(10,...points.map(p=>p.s));for(let i=0;i<=4;i++){let y=pad.t+(h-pad.t-pad.b)*i/4,val=Math.round(max*(1-i/4));x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke();x.fillText(val,3,y+4)}if(points.length<2){x.fillText('Ei tarpeeksi nopeuspisteitä käyrään',pad.l+10,h/2);chartPoints=[];return}let t0=points[0].t,t1=points.at(-1).t||t0+1;chartPoints=points.map(p=>({x:pad.l+(p.t-t0)/(t1-t0||1)*(w-pad.l-pad.r),y:pad.t+(1-p.s/max)*(h-pad.t-pad.b),p}));x.beginPath();chartPoints.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.strokeStyle='#36e39b';x.lineWidth=3;x.stroke();x.fillStyle='#8fa4b5';x.fillText('0:00',pad.l,h-7);x.fillText(fmt(t1-t0).replace(/^00:/,''),w-pad.r-34,h-7)}
$('chart').addEventListener('pointerdown',e=>{if(!chartPoints.length)return;let r=e.target.getBoundingClientRect(),xx=e.clientX-r.left,q=chartPoints.reduce((a,b)=>Math.abs(b.x-xx)<Math.abs(a.x-xx)?b:a);$('chartTip').textContent=`${new Date(q.p.t).toLocaleTimeString('fi-FI')} · ${fi(q.p.s,1)} km/h · ${fi(q.p.d,2)} km`});$('backLog').onclick=renderSessions;$('clearLog').onclick=()=>{sessions=[];current=null;save();renderSessions()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.panel).classList.add('active');if(b.dataset.panel==='logPanel')renderSessions()});window.addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue=''}});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('fi-FI'),250);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)lock()});update();
</script></body></html>
